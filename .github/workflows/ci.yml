name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,azure,google]"
      - run: python -m pytest -m acceptance -q
      - run: python -m pytest -q -m "not integration"
      - run: python -m ruff check src tests scripts examples
      - run: python -m ruff format --check src tests scripts examples
      - run: python -m mypy

  artifacts:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "build>=1.3,<2"
      - run: python -m build
      - run: python scripts/audit_artifacts.py dist
      - run: python -m venv .venv-smoke
      - run: .venv-smoke/bin/python -m pip install dist/*.whl
      - run: .venv-smoke/bin/python scripts/smoke_artifact.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
