[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moiryx"
version = "0.1.0a1"
description = "Thin, config-driven Python runtime for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Moiryx contributors" }]
urls = { Repository = "https://github.com/kamilsz713/moiryx", Issues = "https://github.com/kamilsz713/moiryx/issues" }
keywords = ["agents", "llm", "tools", "structured-output"]
dependencies = [
    "docstring-parser>=0.17,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.12,<3",
    "PyYAML>=6,<7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
azure = []
google = ["google-genai>=1,<2"]
all = ["google-genai>=1,<2"]
dev = [
    "build>=1.3,<2",
    "mypy>=1.11,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15,<0.16",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moiryx = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "acceptance: deterministic user-path and AC1-AC11 release acceptance checks",
    "integration: opt-in test requiring an explicitly configured live service",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["src/moiryx"]
pretty = true
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
